# Deploy the static export to GitHub Pages.
#
# One-time repo setup: Settings → Pages → Source → "GitHub Actions".
# Every push to main then publishes to
# https://<username>.github.io/<repo>/ automatically.
#
# Without this workflow GitHub falls back to its legacy Jekyll builder,
# which ignores ./out entirely and renders README.md as the home page.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Repo-scoped Pages hosts under /<repo>/ — tell Next.js.
      - name: Build and export
        run: npm run build
        env:
          PAGES_BASE_PATH: "/${{ github.event.repository.name }}"

      # Belt and braces: stop any Jekyll processing from eating /_next/*.
      - name: Disable Jekyll
        run: touch ./out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
